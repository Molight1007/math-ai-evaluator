# MathPilot 数学智能体评测器 — 容器编排（v2 重构版）
# ─────────────────────────────────────────────────────────────
# 前置：deploy/.env 存在即可（仓库已跟踪占位模板，API key 留空；
#       密钥由 Web 端「用户设置」写入 user_api_settings.json 后注入容器）。
#
# 常用命令（在 deploy/ 目录下执行）：
#   docker compose up -d --build      # 构建并后台启动
#   docker compose ps                 # 查看状态（含健康检查）
#   docker compose logs -f            # 跟随日志
#   docker compose down               # 停止（保留数据卷）
#   docker compose -f docker-compose.dev.yml up -d   # 开发模式（代码热更新）
#
# 可配置环境变量（写进 deploy/.env 或宿主环境）：
#   HOST_PORT=8080         # 宿主映射端口（默认 5000）
#   GUNICORN_WORKERS=1     # gunicorn worker 数（默认 1，勿 >1，见 Dockerfile）
#   GUNICORN_TIMEOUT=300   # 单请求超时（秒）
# ─────────────────────────────────────────────────────────────
services:
  math-evaluator:
    build:
      context: ..          # 仓库根目录（根 .dockerignore 控制构建上下文体积）
      dockerfile: deploy/Dockerfile
    image: math-evaluator:latest
    container_name: math-evaluator
    environment:
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-1}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-300}
    ports:
      - "${HOST_PORT:-5000}:5000"   # 宿主机端口可配（默认 5000）
    env_file:
      - path: .env
        required: false    # .env 缺失不阻断启动（API key 由 Web 端设置注入）
    init: true             # 以 init 进程回收僵尸子进程（评测线程派生场景）
    volumes:
      - ./results:/app/测试结果                    # 持久化评测结果
      - ../题库:/app/题库                          # 挂载本地题库（覆盖镜像内置副本）
      - ./users.json:/app/users.json              # 持久化用户账号
      - ./user_api_settings.json:/app/user_api_settings.json  # 持久化各用户 API 设置
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.create_connection(('127.0.0.1',5000),3); s.close(); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G       # 内存上限（评测任务并发时防 OOM 拖垮宿主机）
          cpus: "2.0"      # CPU 上限
