:root{--dg-bg:#ffffff;--dg-ink:#1f2430;--dg-muted:#8b94a7;--dg-panel:#f7f8fa;--dg-line:#e5e8ee;--dg-accent:#3d7eff;}

body{margin:0;background:var(--dg-bg);color:var(--dg-ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;transition:background .2s,color .2s}
#bar{position:sticky;top:0;z-index:9;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--dg-panel);border-bottom:1px solid var(--dg-line)}
#bar input,#bar select,#bar button{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--dg-line);background:var(--dg-bg);color:var(--dg-ink);cursor:pointer}
#bar input{cursor:text;min-width:190px}
#bar button:hover{border-color:var(--dg-accent)}
#bar .sp{flex:1}
#hint{padding:7px 16px;font-size:12.5px;color:var(--dg-muted);border-bottom:1px solid var(--dg-line);background:var(--dg-bg)}
#wrap{overflow:auto;padding:8px 16px 40px}
svg{max-width:100%;height:auto;display:block}
.dg-ink{fill:var(--dg-ink)} .dg-muted{fill:var(--dg-muted)} .nlabel{fill:var(--dg-ink)}
.elabel{fill:var(--dg-muted)}
.node{transition:opacity .15s}
.node .nbox{transition:stroke-width .15s}
svg.focusing .node{opacity:.18}
svg.focusing .node.hit{opacity:1}
svg.focusing .edge{opacity:.12}
svg.focusing .edge.hit{opacity:1}
.node.hit .nbox{stroke-width:3;stroke:var(--dg-accent)}
.node.sel .nbox{stroke-width:3;stroke:#f59e0b}
.node:focus{outline:none}
.edge.hit{stroke-width:3}
#legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 16px;font-size:12px;color:var(--dg-muted);border-top:1px solid var(--dg-line)}
#legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
kbd{font:11px ui-monospace,Consolas,monospace;border:1px solid var(--dg-line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--dg-muted)}

ext class="nlabel" x="1582.0" y="197.0" font-size="13" font-weight="600" text-anchor="middle">自改进</text><text class="dg-muted" x="1582.0" y="207.0" font-size="10.5" text-anchor="middle">温度分层 · 截断续写 · IMO2025 论文 Step2</text></g><g class="node" data-id="collab" tabindex="0"><rect class="nbox" x="1736.0" y="153.0" width="172.0" height="62.0" rx="9" fill="#dbeafe" stroke="#e5e8ee" stroke-width="1.4"/><text class="nlabel" x="1822.0" y="188.5" font-size="13" font-weight="600" text-anchor="middle">deep 档三 Agent 协作</text><text class="dg-muted" x="1822.0" y="207.0" font-size="10.5" text-anchor="middle">解题→审查→整合→反复验证</text></g><g class="node onpath" data-id="leangate" tabindex="0"><rect x="1973.0" y="150.0" width="178.0" height="68.0" rx="11" fill="none" stroke="#3d7eff" stroke-width="2.4"/><rect class="nbox" x="1976.0" y="153.0" width="172.0" height="62.0" rx="9" fill="#fee2e2" stroke="#3d7eff" stroke-width="1.4"/><text class="nlabel" x="2062.0" y="188.5" font-size="13" font-weight="600" text-anchor="middle">阶段二 Lean 硬验证门禁</text><text class="dg-muted" x="2062.0" y="207.0" font-size="10.5" text-anchor="middle">证明题整题 verify；计算/解答题 verify_answer（norm_num/ring，5-21s）</text></g><g class="node onpath" data-id="verify" tabindex="0"><rect x="2213.0" y="150.0" width="178.0" height="68.0" rx="11" fill="none" stroke="#3d7eff" stroke-width="2.4"/><rect class="nbox" x="2216.0" y="153.0" width="172.0" height="62.0" rx="9" fill="#dcfce7" stroke="#3d7eff" stroke-width="1.4"/><text class="nlabel" x="2302.0" y="188.5" font-size="13" font-weight="600" text-anchor="middle">四重验证投票</text><text class="dg-muted" x="2302.0" y="207.0" font-size="10.5" text-anchor="middle">聚类投票 + AnswerOracle 客观复核 + 对抗式证伪 + 确定性校验</text></g><g class="node" data-id="review" tabindex="0"><rect class="nbox" x="2456.0" y="107.0" width="172.0" height="62.0" rx="9" fill="#dbeafe" stroke="#e5e8ee" stroke-width="1.4"/><text class="nlabel" x="2542.0" y="142.5" font-size="13" font-weight="600" text-anchor="middle">Step4 反馈复核</te <script>window.__VIEWS__=[{"id": "v1", "label": "两阶段主链路", "focus": ["pacer", "classify", "router", "preverify", "sketch", "subgoal", "solve", "leangate", "verify", "formatter", "out"], "note": "deep 档完整链路"}, {"id": "v2", "label": "阶段一 · 题目理解", "focus": ["classify", "router", "preverify", "sketch", "subgoal"], "note": "preverify 失败→带编译错误重新理解，循环至通过或达上限"}, {"id": "v3", "label": "阶段二 · 答案审核", "focus": ["solve", "leangate", "verify", "revise", "formatter", "out"], "note": "证明题整题 verify / 计算题 verify_answer；invalid 反馈定位修正"}, {"id": "v4", "label": "Lean 证据链", "focus": ["preverify", "leangate", "verify", "out"], "note": "老师 #1 关切：used_theorems / answer_valid 进材料"}];</script>
<script>
(function(){
const svg=document.getElementById('dg');
const nodes=[...svg.querySelectorAll('.node')];
const edges=[...svg.querySelectorAll('.edge')];
const byId=new Map(nodes.map(n=>[n.dataset.id,n]));
const succ=new Map(),pred=new Map();
nodes.forEach(n=>{succ.set(n.dataset.id,[]);pred.set(n.dataset.id,[])});
edges.forEach(e=>{const a=e.dataset.from,b=e.dataset.to;
  if(succ.has(a)&&pred.has(b)){succ.get(a).push(b);pred.get(b).push(a);}});
const hint=document.getElementById('hint');
function say(t){hint.innerHTML=t;}
function clear(){svg.classList.remove('focusing');
  nodes.forEach(n=>n.classList.remove('hit','sel'));edges.forEach(e=>e.classList.remove('hit'));}

// ── 可达集合
function reach(id,map){const seen=new Set(),q=[id];
  while(q.length){const c=q.pop();for(const n of map.get(c)||[])if(!seen.has(n)){seen.add(n);q.push(n);}}
  return seen;}
function show(ids,msg){clear();svg.classList.add('focusing');
  ids.forEach(i=>byId.get(i)&&byId.get(i).classList.add('hit'));
  edges.forEach(e=>{if(ids.has(e.dataset.from)&&ids.has(e.dataset.to))e.classList.add('hit');});
  say(msg);}
function focusNode(id){const up=reach(id,pred),dn=reach(id,succ);
  const ids=new Set([id,...up,...dn]);show(ids,
   `<b>${id}</b> · 上游 ${up.size} 个 / 下游 ${dn.size} 个（沿已写入的有向边，不推断未声明的关系）`);}

// ── Route Probe：只在已写入的边上做 BFS，找不到就明说
let probeA=null;
function probe(b){if(!probeA){probeA=b;say(`起点 <b>${b}</b> 已选，再点一个节点求路径`);return;}
  const a=probeA;probeA=null;
  if(a===b){say('起点与终点相同，已取消');return;}
  const prev=new Map([[a,null]]),q=[a];let found=false;
  while(q.length){const c=q.shift();if(c===b){found=true;break;}
    for(const n of succ.get(c)||[])if(!prev.has(n)){prev.set(n,c);q.push(n);}}
  if(!found){clear();say(`<b>${a}</b> → <b>${b}</b>：<span style="color:#dc2626">无可达路径</span>（IR 中未写入这条链路，不临时脑补中间环节）`);
    byId.get(a)&&byId.get(a).classList.add('sel');byId.get(b)&&byId.get(b).classList.add('sel');svg.classList.add('focusing');
    [a,b].forEach(i=>byId.get(i)&&byId.get(i).classList.add('hit'));return;}
  const path=[];for(let c=b;c!==null;c=prev.get(c))path.unshift(c);
  clear();svg.classList.add('focusing');
  path.forEach(i=>byId.get(i)&&byId.get(i).classList.add('hit'));
  const ps=new Set(path);
  edges.forEach(e=>{for(let k=0;k<path.length-1;k++)
    if(e.dataset.from===path[k]&&e.dataset.to===path[k+1])e.classList.add('hit');});
  say(`路径 <b>${a} → ${b}</b>：${path.join(' → ')}（${path.length-1} 跳）`);}

nodes.forEach(n=>n.addEventListener('click',ev=>{ev.stopPropagation();
  if(ev.shiftKey)probe(n.dataset.id);else{focusNode(n.dataset.id);
    history.replaceState(null,'','?node='+n.dataset.id);}}));
svg.addEventListener('click',clear);

// ── 搜索
const q=document.getElementById('q');
q.addEventListener('input',()=>{const v=q.value.trim().toLowerCase();
  if(!v){clear();say(defHint);return;}
  const m=nodes.filter(n=>n.dataset.id.toLowerCase().includes(v)||n.textContent.toLowerCase().includes(v));
  if(!m.length){say('没有匹配的节点');return;}
  clear();svg.classList.add('focusing');m.forEach(n=>n.classList.add('hit'));
  say(`匹配 ${m.length} 个节点：${m.slice(0,8).map(n=>n.dataset.id).join('、')}${m.length>8?' …':''}`);});
document.getElementById('probe').onclick=()=>{probeA=null;say('路径探测：按住 <kbd>Shift</kbd> 依次点击两个节点');};

// ── 引导视图
const vs=window.__VIEWS__||[];
const sel=document.getElementById('views');
vs.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.label;sel.appendChild(o);});
sel.onchange=()=>{const v=vs[+sel.value];if(!v)return;show(new Set(v.focus),`<b>${v.label}</b> ${v.note||''}`);};

// ── 主题 / 导出
const T='dg-theme';
if(localStorage.getItem(T)==='dark')document.body.classList.add('dark');
document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');
  localStorage.setItem(T,document.body.classList.contains('dark')?'dark':'light');};
document.getElementById('exp').onclick=()=>{
  const s=new XMLSerializer().serializeToString(svg);
  const b=new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+s],{type:'image/svg+xml'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=(document.title||'diagram')+'.svg';a.click();URL.revokeObjectURL(a.href);};
const defHint=document.getElementById('hint').dataset.hint;
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){if(e.key==='Escape'){q.value='';q.dispatchEvent(new Event('input'));}return;}
  if(e.key==='/'){e.preventDefault();q.focus();}
  else if(e.key==='t'||e.key==='T')document.getElementById('theme').click();
  else if(e.key==='e'||e.key==='E')document.getElementById('exp').click();
  else if(e.key==='Escape')clear();});
const p=new URLSearchParams(location.search).get('node');
if(p&&byId.has(p))focusNode(p);
})();
</script>
