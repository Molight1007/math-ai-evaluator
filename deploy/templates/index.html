<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数学智能体评测器</title><style>
:root{--bg:#f0f2f5;--card:#fff;--p:#4361ee;--ph:#3a56d4;--pl:#eef1ff;--t:#1a1a2e;--ts:#64748b;--tm:#94a3b8;--b:#e2e8f0;--s:#10b981;--sb:#d1fae5;--w:#f59e0b;--wb:#fef3c7;--e:#ef4444;--eb:#fee2e2;--r:12px;--rs:8px;--sh:0 1px 3px rgba(0,0,0,.06)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);min-height:100vh}.ctr{max-width:1100px;margin:0 auto;padding:20px 24px}.hdr{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px;flex-wrap:wrap;gap:12px}.hdr h1{font-size:24px;font-weight:700;background:linear-gradient(135deg,var(--p),#7209b7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--card);border-radius:var(--r);padding:4px;box-shadow:var(--sh)}.tab-btn{flex:1;padding:10px 20px;border:none;background:0 0;cursor:pointer;font-size:14px;font-weight:600;color:var(--ts);border-radius:9px;transition:.2s;white-space:nowrap}.tab-btn:hover{background:var(--pl);color:var(--p)}.tab-btn.active{background:var(--p);color:#fff}.tab-c{display:none}.tab-c.active{display:block}.card{background:var(--card);border-radius:var(--r);padding:24px;margin-bottom:16px;box-shadow:var(--sh)}.card h2{font-size:17px;margin-bottom:16px;color:var(--t);display:flex;align-items:center;gap:8px}label{display:block;margin-bottom:4px;font-weight:600;font-size:13px;color:var(--ts)}input,select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--b);border-radius:var(--rs);font-size:14px;font-family:inherit;background:#fafbfc;outline:0;transition:.2s}input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(67,97,238,.12);background:#fff}textarea{resize:vertical;min-height:80px}.fr{display:flex;gap:12px;flex-wrap:wrap}.fr>*{flex:1;min-width:140px}.fi{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border:none;border-radius:var(--rs);cursor:pointer;font-size:14px;font-weight:600;transition:.2s;white-space:nowrap;text-decoration:none}.btn-p{background:var(--p);color:#fff}.btn-p:hover{background:var(--ph);transform:translateY(-1px);box-shadow:0 4px 12px rgba(67,97,238,.3)}.btn-s{background:var(--s);color:#fff}.btn-d{background:var(--e);color:#fff}.btn-o{background:0 0;color:var(--p);border:1.5px solid var(--p)}.btn-o:hover{background:var(--pl)}.btn-sm{padding:5px 12px;font-size:12px}.btn-xs{padding:3px 8px;font-size:11px}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}.st{padding:10px 14px;border-radius:var(--rs);font-size:13px;margin-top:10px}.st-i{background:var(--pl);color:var(--p)}.st-s{background:var(--sb);color:#065f46}.st-w{background:var(--wb);color:#92400e}.st-e{background:var(--eb);color:#991b1b}.pw{margin-top:12px}.pb{width:100%;height:8px;background:#e9ecef;border-radius:4px;overflow:hidden}.pf{height:100%;background:linear-gradient(90deg,var(--p),#7209b7);border-radius:4px;transition:width .5s;width:0}.pf.indet{width:30%;animation:indet 1.5s ease-in-out infinite}@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}.pt{margin-top:6px;font-size:12px;color:var(--tm)}.dt{width:100%;border-collapse:collapse;font-size:13px}.dt th{background:#f8fafc;padding:10px 12px;text-align:left;font-size:12px;font-weight:600;color:var(--ts);border-bottom:2px solid var(--b)}.dt td{padding:10px 12px;border-bottom:1px solid #f3f4f6}.dt tr:hover{background:#f8fafc}.dt tr.clk{cursor:pointer}.dt tr.clk:hover{background:var(--pl)}.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}.bg-s{background:var(--sb);color:#065f46}.bg-w{background:var(--wb);color:#92400e}.bg-e{background:var(--eb);color:#991b1b}.bg-d{background:#e0e7ff;color:#3730a3}.uz{border:2px dashed var(--b);border-radius:var(--r);padding:36px 24px;text-align:center;cursor:pointer;transition:.2s;background:#fafbfc}.uz:hover,.uz.drag{border-color:var(--p);background:var(--pl)}.uz .uic{font-size:40px;margin-bottom:8px}.uz .utx{color:var(--ts);font-size:14px}.uz .uht{color:var(--tm);font-size:12px;margin-top:4px}.uz .fnm{color:var(--p);font-weight:600;font-size:14px;margin-top:6px;display:none}.ti{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f3f4f6;flex-wrap:wrap;gap:8px}.ti:last-child{border-bottom:none}.tl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.tr{display:flex;gap:6px;flex-wrap:wrap}.tn{font-weight:600;font-size:13px}.tt{font-size:12px;color:var(--tm)}.es{text-align:center;padding:32px;color:var(--tm)}.mo{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.5);backdrop-filter:blur(3px);z-index:1000;align-items:center;justify-content:center}.mo.ac{display:flex}.mc{background:#fff;border-radius:16px;width:90%;max-width:700px;max-height:85vh;box-shadow:0 20px 50px rgba(0,0,0,.2);display:flex;flex-direction:column;animation:su .25s ease}@keyframes su{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--b)}.mh h3{font-size:16px}.mcx{width:30px;height:30px;border-radius:50%;border:none;background:#f1f5f9;cursor:pointer;font-size:16px;transition:.2s}.mcx:hover{background:var(--e);color:#fff}.mb{padding:20px 24px;overflow-y:auto;flex:1}.mb label{margin-top:10px}.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:var(--rs);font-size:14px;font-weight:600;z-index:2000;animation:si .3s ease;box-shadow:0 4px 14px rgba(0,0,0,.1)}@keyframes si{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}.toast.s{background:var(--s);color:#fff}.toast.e{background:var(--e);color:#fff}.toast.i{background:var(--p);color:#fff}@media(max-width:640px){.ctr{padding:12px}.tabs{flex-direction:column}.fr>*{min-width:100%}}</style></head><body><div class="ctr"><div class="hdr" id="hdr"><h1>数学智能体评测器</h1><div><button class="btn btn-o btn-sm" onclick="os()">API 设置</button></div></div><div class="tabs"><button class="tab-btn active" onclick="st('eval')">文件评测</button><button class="tab-btn" onclick="st('bank')">题库评测</button><button class="tab-btn" onclick="st('browse')">题库浏览</button></div><div id="te" class="tab-c active"><div class="card"><h2>上传文件评测</h2><div class="uz" id="uz" onclick="g('fi').click()"><div class="uic">[+]</div><div class="utx">点击选择文件或拖拽到此处</div><div class="uht">支持 PDF/Word/JSON/CSV/PPT/Markdown/Excel</div><div class="fnm" id="fn"></div></div><input type="file" id="fi" accept=".pdf,.docx,.json,.csv,.pptx,.ppt,.md,.xlsx" style="display:none" onchange="fs(this)"></div><div class="card"><h2>评测设置</h2><div class="fr"><div><label>并发数</label><input type="number" id="co" value="10" min="1" max="50"></div><div><label>最大题目数(0=全部)</label><input type="number" id="mp" value="0" min="0"></div><div style="display:flex;align-items:flex-end;gap:16px;padding-bottom:2px"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin:0"><input type="checkbox" id="ma" checked>多智能体</label><label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin:0"><input type="checkbox" id="ul">Lean验证</label></div></div><button class="btn btn-p" id="seb" onclick="sev()" style="margin-top:12px">开始评测</button><div id="ep" style="display:none"></div></div><div class="card"><h2>评测任务历史</h2><div id="tl"><div class="es">暂无评测任务</div></div></div></div><div id="tb" class="tab-c"><div class="card"><h2>题库管理</h2><div class="fi" style="margin-bottom:12px"><div style="flex:1;min-width:160px"><label>当前题库</label><select id="bs" onchange="obc()"><option value="">--请先创建题库--</option></select></div><div><label>&nbsp;</label><button class="btn btn-o btn-sm" onclick="rb()">刷新</button></div></div><div class="fi" style="margin-bottom:12px"><div style="flex:1;min-width:120px"><label>新建题库</label><input type="text" id="nbn" placeholder="输入题库名称"></div><div><label>&nbsp;</label><button class="btn btn-s btn-sm" onclick="cb()">创建</button></div><div><label>&nbsp;</label><button class="btn btn-d btn-sm" onclick="db()">删除</button></div></div><div id="bst" class="st st-i">题库统计: --</div></div><div class="card"><h2>题目操作</h2><div class="fi" style="gap:8px"><button class="btn btn-o btn-sm" onclick="g('ifi').click()">从文件导入</button><input type="file" id="ifi" accept=".json,.csv,.docx,.pdf,.pptx,.ppt,.md,.xlsx" style="display:none" onchange="iff(this)"><button class="btn btn-o btn-sm" onclick="oma()">手动添加</button><button class="btn btn-o btn-sm" onclick="sau()">AI质量审核</button><button class="btn btn-o btn-sm" onclick="g('afi').click()">导入答案</button><input type="file" id="afi" accept=".docx,.pptx,.ppt,.pdf" style="display:none" onchange="ia(this)"></div></div><div class="card"><h2>随机选题评测</h2><div class="fr"><div><label>选题数量</label><input type="number" id="rc" value="5" min="1" max="999"></div><div><label>限定领域</label><select id="df"><option value="">全部</option></select></div><div style="display:flex;align-items:flex-end;padding-bottom:2px"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin:0"><input type="checkbox" id="bma" checked>多智能体</label></div></div><button class="btn btn-p" onclick="sbe()" style="margin-top:10px">随机选题评测</button><div id="bep" style="display:none"></div></div><div class="card"><h2>评测历史</h2><div id="bankTaskList"><div class="es">暂无评测记录</div></div></div></div><div id="tbr" class="tab-c"><div class="card"><h2>题库浏览器</h2><div class="fi" style="margin-bottom:12px"><div style="flex:1;min-width:150px"><label>选择题库</label><select id="bbs" onchange="obbc()"><option value="">--请选择题库--</option></select></div><div style="flex:1;min-width:150px"><label>搜索</label><input type="text" id="bsr" placeholder="搜索关键词..." oninput="bs()"></div><div style="min-width:120px"><label>领域</label><select id="bd" onchange="bs()"><option value="">全部</option></select></div><div style="min-width:70px"><label>每页</label><select id="bps" onchange="bs()"><option value="20">20</option><option value="30" selected>30</option><option value="50">50</option></select></div></div><div id="brs" style="font-size:13px;color:var(--ts);margin-bottom:10px"></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px"><div id="bpi" style="font-size:12px;color:var(--tm)">--</div><div style="display:flex;gap:6px"><button class="btn btn-o btn-xs" onclick="bpp()">上一页</button><button class="btn btn-o btn-xs" onclick="bnp()">下一页</button></div></div><div style="overflow-x:auto"><table class="dt" id="brt"><thead><tr><th>ID</th><th>题干</th><th>领域</th><th>答案</th><th>操作</th></tr></thead><tbody><tr><td colspan="5" class="es">请选择题库</td></tr></tbody></table></div><div id="brst" style="font-size:12px;color:var(--tm);margin-top:6px">就绪</div></div></div></div><div class="mo" id="smo"><div class="mc"><div class="mh"><h3>API 设置</h3><button class="mcx" onclick="cs()">X</button></div><div class="mb"><label>Intern-S1 API Key</label><input type="password" id="cik"><label>Intern-S1 URL</label><input type="text" id="ciu" placeholder="https://internlm-chat.intern-ai.org.cn/puyu/api/v1"><label>Intern-S1 Model</label><input type="text" id="cim" placeholder="intern-s1"><label style="margin-top:8px">DeepSeek API Key</label><input type="password" id="cdk"><label>DeepSeek URL</label><input type="text" id="cdu" placeholder="https://api.deepseek.com/v1"><label>DeepSeek Model</label><input type="text" id="cdm" placeholder="deepseek-chat"><button class="btn btn-p" onclick="ss()" style="margin-top:14px;width:100%">保存</button></div></div></div><div class="mo" id="dmo"><div class="mc"><div class="mh"><h3 id="dti">题目详情</h3><button class="mcx" onclick="cd()">X</button></div><div class="mb" id="dbo"></div></div></div><div class="mo" id="mmo"><div class="mc"><div class="mh"><h3>手动添加</h3><button class="mcx" onclick="cm()">X</button></div><div class="mb"><label>题干</label><textarea id="maq" rows="4" placeholder="输入题目..."></textarea><label>领域</label><input type="text" id="mad"><label>参考答案</label><textarea id="maa" rows="3" placeholder="可选..."></textarea><button class="btn btn-p" onclick="dma()" style="margin-top:12px;width:100%">确认</button></div></div></div><script>
if(!document.cookie.includes('session')){var u=sessionStorage.getItem('user');if(!u){fetch('/api/me').then(function(r){return r.json()}).then(function(j){if(!j.logged_in){location.href='/login.html'}else{sessionStorage.setItem('user',j.username);sessionStorage.setItem('role',j.role||'user');initUI(j.username,j.role)}}).catch(function(){location.href='/login.html'})}else{initUI(u,sessionStorage.getItem('role')||'user')}}else{initUI('','user')}
var currentUser='',currentRole='';
function initUI(user,role){currentUser=user;currentRole=role;var hdr=g('hdr');if(user){hdr.innerHTML=hdr.innerHTML.replace('</div>','<span style=font-size:12px;color:var(--ts)>'+user+'</span><button class="btn btn-o btn-xs" onclick=logout() style=margin-left:6px>退出</button></div>');if(role==='admin'){var ubtn=document.createElement('button');ubtn.className='btn btn-o btn-xs';ubtn.textContent='用户管理';ubtn.onclick=showUserMgr;ubtn.style.marginLeft='6px';hdr.querySelector('div').appendChild(ubtn)}}}
async function logout(){await fetch('/api/logout',{method:'POST'});sessionStorage.clear();location.href='/login.html'}
function g(id){return document.getElementById(id)}
function st(n){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.tab-c').forEach(c=>c.classList.remove('active'));document.querySelector('[onclick="st(\''+n+'\')"]').classList.add('active');g({'eval':'te','bank':'tb','browse':'tbr'}[n]).classList.add('active');if(n==='bank'||n==='browse'){rb().then(function(){if(n==='browse'&&g('bs').value){g('bbs').value=g('bs').value;obbc()}})}else if(n==='eval'){lt()}}
function ts(msg,tp){var d=document.createElement('div');d.className='toast '+(tp||'i');d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove()},3000)}
function eh(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
var sf=null;
function fs(inp){if(inp.files.length>0){sf=inp.files[0];var el=g('fn');el.textContent='已选择: '+sf.name;el.style.display='block'}}
g('uz').addEventListener('dragover',function(e){e.preventDefault();g('uz').classList.add('drag')});
g('uz').addEventListener('dragleave',function(){g('uz').classList.remove('drag')});
g('uz').addEventListener('drop',function(e){e.preventDefault();g('uz').classList.remove('drag');if(e.dataTransfer.files.length>0){sf=e.dataTransfer.files[0];var el=g('fn');el.textContent='已选择: '+sf.name;el.style.display='block'}});
async function sev(){if(!sf){ts('请先选择文件','e');return}var btn=g('seb');btn.disabled=true;btn.textContent='提交中...';var fd=new FormData();fd.append('file',sf);fd.append('concurrency',g('co').value);fd.append('max_problems',g('mp').value);fd.append('multi_agent',g('ma').checked?'1':'0');fd.append('use_lean',g('ul').checked?'1':'0');var r=await fetch('/api/evaluate',{method:'POST',body:fd});var j=await r.json();if(j.error){ts(j.error,'e');btn.disabled=false;btn.textContent='开始评测';return}var pd=g('ep');pd.style.display='block';pd.innerHTML='<div class="pw"><div class="pb"><div class="pf indet"></div></div><div class="pt">评测已提交，正在处理...</div></div>';ptk(j.task_id,pd,btn);lt()}
function ptk(tid,wrap,btn){var start=Date.now();var iv=setInterval(async function(){try{var r=await fetch('/api/tasks');var tasks=await r.json();var t=tasks.find(function(x){return x.id===tid});var el=Date.now()-start;if(!t){if(el>300000){clearInterval(iv);wrap.innerHTML='<div class="st st-w">评测超时，请刷新查看</div>';btn.disabled=false;btn.textContent='开始评测';lt()}return}if(t.status==='done'){clearInterval(iv);wrap.innerHTML='<div class="st st-s">评测完成！'+eh(t.progress||'')+'</div><a href="/api/results/'+tid+'/report.html" target="_blank" class="btn btn-s btn-sm" style="margin-top:8px">查看报告</a><a href="/api/results/'+tid+'/report.html" download class="btn btn-o btn-sm" style="margin-top:8px;margin-left:6px">下载</a>';btn.disabled=false;btn.textContent='开始评测';lt()}else if(t.status==='error'){clearInterval(iv);wrap.innerHTML='<div class="st st-e">评测失败: '+eh(t.error||'未知错误')+'</div>';btn.disabled=false;btn.textContent='开始评测';lt()}else if(el>300000){clearInterval(iv);wrap.innerHTML='<div class="st st-w">评测超时</div>';btn.disabled=false;btn.textContent='开始评测';lt()}else{wrap.innerHTML='<div class="pw"><div class="pb"><div class="pf indet"></div></div><div class="pt">'+eh(t.progress||'评测中...')+' ('+Math.floor(el/1000)+'s)</div></div>'}}catch(e){if(Date.now()-start>300000){clearInterval(iv);btn.disabled=false;btn.textContent='开始评测'}}},2000)}
async function lt(){try{var r=await fetch('/api/tasks');if(!r.ok)return;var tasks=await r.json();var sorted=(tasks||[]).slice().sort(function(a,b){return (b.created_at||'').localeCompare(a.created_at||'')});var h='';if(sorted.length===0){h='<div class="es">暂无评测任务</div>'}else{sorted.forEach(function(t){var b=t.status==='done'?'<span class="badge bg-s">完成</span>':t.status==='error'?'<span class="badge bg-e">失败</span>':'<span class="badge bg-w">运行中</span>';var a=t.status==='done'?'<a href="/api/results/'+t.id+'/report.html" target="_blank" class="btn btn-o btn-xs">查看</a><a href="/api/results/'+t.id+'/report.html" download class="btn btn-o btn-xs">下载</a>':'';h+='<div class="ti"><div class="tl"><span class="tn">'+eh(t.filename)+'</span>'+b+'<span class="tt">'+eh(t.created_at||'')+'</span></div><div class="tr">'+a+'</div></div>'})}g('tl').innerHTML=h}catch(e){}}
async function rb(){var r=await fetch('/api/banks');var banks=await r.json();var ns=banks.map(function(b){return b.name});var s1=g('bs');var s2=g('bbs');s1.innerHTML=ns.length?ns.map(function(n){return '<option value="'+n+'">'+n+'</option>'}).join(''):'<option value="">--请先创建题库--</option>';s2.innerHTML='<option value="">--请选择题库--</option>'+ns.map(function(n){return '<option value="'+n+'">'+n+'</option>'}).join('');if(ns.length){s1.value=ns[0];obc()}}
async function obc(){var b=g('bs').value;if(!b)return;var r=await fetch('/api/bank/'+encodeURIComponent(b)+'/stats');var s=await r.json();g('bst').innerHTML='题库: <b>'+eh(b)+'</b> | 题目数: <b>'+s.problem_count+'</b> | 领域: <b>'+(s.domains||[]).join(', ')||'未分类'+'</b> | 答案覆盖率: <b>'+(s.answer_coverage||'0')+'%</b>';var df=g('df');df.innerHTML='<option value="">全部</option>'+(s.domains||[]).map(function(d){return '<option value="'+d+'">'+d+'</option>'}).join('');}
async function cb(){var n=g('nbn').value.trim();if(!n){ts('请输入题库名称','e');return}var r=await fetch('/api/bank/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});var j=await r.json();if(j.error){ts(j.error,'e');return}ts('题库"'+n+'"创建成功','s');g('nbn').value='';rb()}
async function db(){var b=g('bs').value;if(!b){ts('请先选择题库','e');return}if(!confirm('确定要删除题库"'+b+'"及其所有题目吗？'))return;var r=await fetch('/api/bank/'+encodeURIComponent(b)+'/delete',{method:'POST'});var j=await r.json();ts(j.message||'删除成功','s');rb()}
async function iff(inp){var b=g('bs').value;if(!b){ts('请先选择题库','e');return}if(!inp.files.length)return;var fd=new FormData();fd.append('file',inp.files[0]);fd.append('bank_name',b);var r=await fetch('/api/bank/import',{method:'POST',body:fd});var j=await r.json();if(j.error){ts(j.error,'e');return}ts('导入完成: 新增 '+j.added+' 题，跳过 '+j.skipped+' 题','s');obc();inp.value=''}

function pollsbe(tid){var start=Date.now();var wrap=g('bep');var iv=setInterval(async function(){try{var r=await fetch('/api/tasks');var tasks=await r.json();var t=tasks.find(function(x){return x.id===tid});var el=Date.now()-start;if(!t){if(el>300000){clearInterval(iv);wrap.innerHTML='<div class="st st-w">评测超时</div>'}return}if(t.status==='done'){clearInterval(iv);wrap.innerHTML='<div class="st st-s">评测完成！'+eh(t.progress||'')+'</div><a href="/api/results/'+tid+'/report.html" target="_blank" class="btn btn-s btn-sm" style="margin-top:6px">查看报告</a> <a href="/api/results/'+tid+'/report.html" download class="btn btn-o btn-sm" style="margin-top:6px">下载报告</a>';lt()}else if(t.status==='error'){clearInterval(iv);wrap.innerHTML='<div class="st st-e">评测失败: '+eh(t.error||'未知错误')+'</div>';lt()}else if(el>300000){clearInterval(iv);wrap.innerHTML='<div class="st st-w">评测超时</div>';lt()}else{wrap.innerHTML='<div class="pw"><div class="pb"><div class="pf indet"></div></div><div class="pt">'+eh(t.progress||'评测中...')+' ('+Math.floor(el/1000)+'s)</div></div>'}}catch(e){if(Date.now()-start>300000){clearInterval(iv)}}},2000)}
