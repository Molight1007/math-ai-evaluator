 whose joint use enables a concise proof -- a task we call global premise retrieval. Existing tools address adjacent problems: semantic search engines find individual declarations matching a query, while premise-selection systems predict useful lemmas one tactic step at a time. Neither recovers the full premise set an entire theorem requires. We present LeanSearch v2, a two-mode retrieval system for this task. Its standard mode applies a hierarchy-informalized Mathlib corpus with an embedding-reranker pipeline, achieving state-of-the-art single-query retrieval without domain-specific fine-tuning (nDCG@10 of 0.62 vs. 0.53 for the next-best system). Its reasoning mode builds on standard mode as its retrieval substrate, targeting global premise retrieval through iterative sketch-retrieve-reflect cycles. On a 69-query benchmark of research-level Mathlib theorems, reasoning mode recovers 46.1% of ground-truth premise groups within 10 retrieved candidates, outperforming strong reasoning retrieval systems (38.0%) and premise-selection baselines (9.3%) on the same benchmark. In a controlled downstream evaluation with a fixed prover loop, replacing alternative retrievers with LeanSearch v2 yields the highest proof success (20% vs. 16% for the next-best system and 4% without retrieval), confirming that retrieval quality propagates to proof generation. We have open-sourced all code, data, and benchmarks. Code and data: this https URL . The standard mode is publicly available with API access at this https URL .","author":[{"@type":"Person","name":"Guoxiong Gao"},{"@type":"Person","name":"Zeming Sun"},{"@type":"Person","name":"Jiedong Jiang"},{"@type":"Person","name":"Yutong Wang"},{"@type":"Person","name":"Jingda Xu"},{"@type":"Person","name":"Peihao Wu"},{"@type":"Person","name":"Bryan Dai"},{"@type":"Person","name":"Bin Dong","url":"https://www.alphaxiv.org/@bin-dong","affiliation":{"@type":"Organization","name":"Beijing International Center for Mathematical Research, Peking hmark of research-level Mathlib theorems, reasoning mode recovers 46.1% of ground-truth premise groups within 10 retrieved candidates, outperforming strong reasoning retrieval systems (38.0%) and premise-selection baselines (9.3%) on the same benchmark. In a controlled downstream evaluation with a fixed prover loop, replacing alternative retrievers with LeanSearch v2 yields the highest proof success (20% vs. 16% for the next-best system and 4% without retrieval), confirming that retrieval quality propagates to proof generation. We have open-sourced all code, data, and benchmarks. Code and data: this https URL . The standard mode is publicly available with API access at this https URL .",publicationDate:$R[64]=new Date("2026-05-14T05:15:13.000Z"),license:"http://creativecommons.org/licenses/by/4.0/",canonicalId:"2605.13137v2",blocked:!1,withdrawn:!1,withdrawalNotice:null,createdAt:"Fri May 15 2026 09:12:34 GMT+0000 (Coordinated Universal Time)",updatedAt:"Fri May 15 2026 09:12:34 GMT+0000 (Coordinated Universal Time)",authors:$R[65]=[$R[66]={full_name:"Guoxiong Gao",researcher:null},$R[67]={full_name:"Zeming Sun",researcher:null},$R[68]={full_name:"Jiedong Jiang",researcher:null},$R[69]={full_name:"Yutong Wang",researcher:null},$R[70]={full_name:"Jingda Xu",researcher:null},$R[71]={full_name:"Peihao Wu",researcher:null},$R[72]={full_name:"Bryan Dai",researcher:null},$R[73]={full_name:"Bin Dong",researcher:$R[74]={slug:"bin-dong",name:"Bin Dong",affiliation:"Beijing International Center for Mathematical Research, Peking University",headline:"Executive Vice President @ Zhongguancun Academy, Professor @ Beijing International Center for Mathematical Research, Peking University",bio:"Bin Dong's PDE-net learns partial differential equations from data by representing differential operators as trainable convolutional kernels. He is a Professor at the Beijing International Center for Mathematical Research and the Center for Machine Learning Research at Peking University. His research integrates scientific computing, computational imaging, and ML, specifically bridging wavelet theory and numerical differential equations with deep learning. Dong co-created NuminaMath, a dataset of 860,000 competition math problems, and developed PDE-Net 2.0 to combine symbolic and numeric learning for PDE discovery. His work in Beyond finite layer neural networks interprets deep architectures as discretizations of continuous dynamical systems to improve model training. In clinical applications, he develops wavelet-based medical image reconstruction and models for predicting immunotherapy response in gastric cancer. He has also researched sparse representation on graphs and linearized Bregman iteration for compressive sensing.",photoUrl:"https://proxy.assets.alphaxiv.org/aHR0cHM6Ly9zY2hvbGFyLmdvb2dsZXVzZXJjb250ZW50LmNvbS9jaXRhdGlvbnM_dmlld19vcD12aWV3X3Bob3RvJnVzZXI9ekxYY0M5MEFBQUFKJmNpdHBpZD0xMQ",citations:11413,hIndex:45,researchAreas:$R[75]=["Scientific Computing","Computational Imaging","Machine Learning"],linkedUser:null,links:$R[76]={scholar:"https://scholar.google.com/citations?user=zLXcC90AAAAJ",personalSite:"http://bicmr.pku.edu.cn/~dongbin",linkedin:null,github:"https://github.com/frenzymath",twitter:null,huggingface:null,openreview:"https://openreview.net/profile?id=~Bin_Dong1",dblp:"https://dblp.org/pid/11/6024-1",orcid:"https://orcid.org/0000-0003-1295-3362",bluesky:null,wikipedia:null,cv:"http://bicmr.pku.edu.cn/~dongbin/Biography_files/CV.pdf",email:"dongbin@math.pku.edu.cn"}}}]},dataUpdateCount:2,dataUpdatedAt:1788057529569,error:null,errorUpdateCount:0,errorUpdatedAt:0,fetchFailureCount:0,fetchFailureReason:null,fetchMeta:null,isInvalidated:!1,status:"success",fetchStatus:"idle"},queryKey:$R[77]=["paper-version","019e2ae8-b7aa-73b2-8b8b-2765dc326e09"],queryHash:"[\"paper-version\",\"019e2ae8-b7aa-73b2-8b8b-2765dc326e09\"]"},$R[78]={dehydratedAt:1788057529604,state:$R[79]={data:$R[80]={type:"public",groupId:"019e24e6-8c76-7b83-a2fc-8bafdb3089d6",sourceName:"arXiv",sourceUrl:"https://arxiv.org/abs/2605.13137",citationBibtex:"@misc{gao2026leansearchv2globalpremise,\n      title={LeanSearch v2: Global Premise Retrieval for Lean 4 Theorem Proving}, \n      author={Guoxiong Gao and Zeming Sun and Jiedong Jiang and Yutong Wang and Jingda Xu and Peihao Wu and Bryan Dai and Bin Dong},\n      year={2026},\n      eprint={2605.13137},\n      archivePrefix={arXiv},\n      primaryClass={cs.IR},\n      url={https://arxiv.org/abs/2605.13137}, \n}",citationsCount:null,googleCitationId:null,firstPublicationDate:$R[81]=new Date("2026-05-13T08:04:57.000Z"),resources:$R[82]=[],versions:$R[83]=[$R[84]={id:"019e24e6-8c97-7c68-b344-e73c97bb3860",label:"v1",order:1,publicationDate:$R[85]=new Date("2026-05-13T08:04:57.000Z"),withdrawn:!1},$R[86]={id:"019e2ae8-b7aa-73b2-8b8b-2765dc326e09",label:"v2",order:2,publicationDate:$R[87]=new Date("2026-05-14T05:15:13.000Z"),withdrawn:!1}],universalId:"2605.13137",maxVersionOrder:2,topics:$R[88]=["agents","Computer Science","cs.AI","cs.IR","embedding-methods","information-extraction","ml-systems","reasoning","tool-use"],metrics:$R[89]={commentsCount:0,totalVotes:1,publicTotalVotes:9,visitsCount:$R[90]={last24Hours:1,last7Days:7,last30Days:15,last90Days:71,all:88}},blocked:!1,createdAt:"Thu May 14 2026 05:12:29 GMT+0000 (Coordinated Universal Time)",updatedAt:"Thu May 14 2026 05:12:29 GMT+0000 (Coordinated Universal Time)",organizationInfo:$R[91]=[],verifiedAuthors:$R[92]=[],canSubmitNewVersion:!1,paperSummary:$R[93]={summary:"LeanSearch v2 is an AI-driven retrieval system for Lean 4 theorem proving that solves the problem of global premise retrieval by identifying coherent sets of library lemmas necessary for complete proofs. It achieves an nDCG@10 of 0.623 for single-query search and retrieves 46.1% of ground-truth premise groups within 10 candidates for global premise retrieval, leading to improved end-to-end proof success.",originalProblem:$R[94]=["Mathlib's immense scale and complexity make it difficult to efficiently locate *sets* of interdependent lemmas necessary for complete theorem proofs.","Current semantic search tools only retrieve individual declarations, while premise selection systems focus on local proof states, neither providing the global premise sets needed for an entire proof strategy.","Without effective global premise retrieval, AI theorem provers frequently re-prove existing library lemmas, hindering efficiency and adherence to community standards of reuse."],solution:$R[95]=["LeanSearch v2 Standard Mode employs an LLM-based informalization process to create descriptive corpus items from Mathlib declarations, utilizing an embedding and reranker pipeline for individual lemma retrieval.","LeanSearch v2 Reasoning Mode addresses global premise retrieval through an iterative \"sketch-retrieve-reflect\" loop, where LLMs generate proof outlines, filter retrieved candidates, and provide feedback for revisions to identify coherent lemma sets.","The system's core retrieval models (embedder, reranker) are not fine-tuned on Mathlib-specific data, instead relying on kind-aware prompting and the informalized corpus for domain knowledge integration."],keyInsights:$R[96]=["Effective global premise retrieval requires identifying a *coherent set* of scattered lemmas for an entire proof strategy, a task distinct from finding individual declarations or local tactic-level premises.","A two-stage retrieval pipeline, combining LLM-generated informal descriptions with general-purpose embedding and reranker models (without domain-specific fine-tuning), can achieve superior performance in formal library search.","An iterative LLM-driven \"sketch-retrieve-reflect\" mechanism can successfully identify global premise sets for complex theorems by iteratively refining proof strategies and filtering candidate lemmas."],results:$R[97]=["LeanSearch v2's Standard mode achieved an nDCG@10 of 0.623 and Recall@10 of 0.780 on the MathlibQR benchmark, demonstrating superior performance for single-query search compared to other systems.","For global premise retrieval on MathlibMPR, LeanSearch v2's Reasoning mode recovered 46.1% of ground-truth premise groups within the top 10 candidates and achieved 30.4% proof coverage, outperforming existing reasoning-intensive retrievers.","Integrating LeanSearch v2 (Reasoning mode) into a proof generation workflow resulted in the highest proof success rates (20.0% on FATE-H and 14.0% on MathlibMPR-Prop), showing direct translation of retrieval quality to end-to-end proof success."]},githubStars:null,githubUrl:null,hasRunReport:!1,implementation:null,marimoImplementation:null,legacyResources:$R[98]={github:$R[99]={url:"https://github.com/frenzymath/LeanSearch-v2",description:"",language:"",stars:21}},externalBlog:null,cardPreviewBlobId:null},dataUpdateCount:2,dataUpdatedAt:1788057529569,error:null,errorUpdateCount:0,errorUpdatedAt:0,fetchFailureCount:0,fetchFailureReason:null,fetchMeta:null,isInvalidated:!1,status:"success",fetchStatus:"idle"},queryKey:$R[100]=["paper-group","019e24e6-8c76-7b83-a2fc-8bafdb3089d6"],queryHash:"[\"paper-group\",\"019e24e6-8c76-7b83-a2fc-8bafdb3089d6\"]"}]}}})($R["tsr"]);document.currentScript.remove()</script><script type="module" async="">import("/assets/index-Be0dPrKO.js")</script><script>($R=>$R[39].return(void 0))($R["tsr"]);$_TSR.e();document.currentScript.remove()</script></body></html>
